# ATD 编排配置（S2a 单仓）
# repoPath：目标仓路径，相对路径以本文件所在目录（repo 根）为基准；默认指向本仓自身（开发期自吃）
repoPath: .
# dataDir：S2a 产物根目录（worktrees/logs/prompts/runtime 四子目录）；~ 展开为用户主目录
dataDir: ~/.local/share/atd
# 默认单轮执行超时（分钟）；profile 自带 timeoutMin 时以 profile 为准
defaultTimeoutMin: 60
# 同 repo 并发闸门：同仓同时执行（DISPATCHED+IN_PROGRESS 的 TASK）上限，超出排队（FIFO 按 queued_at）
maxConcurrentPerRepo: 2
# 报告缺失/schema 错的自愈重试上限（RETRY_WAIT；连续失败超限即升级人工卡点 BLOCKED(pending:l3)）
maxRetries: 3
# 自愈重试退避基数（秒）：第 n 次重试等待 retryBackoffSec×2^(n-1)，封顶 240
retryBackoffSec: 60
