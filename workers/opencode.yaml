# 预置 worker：OpenCode task 模式（spawn-cli 协议）+ interactive 聊天（S2b1）
# {{prompt}} 由编排层以参数数组整体替换（prompt 全文单参数）；工作目录由编排层以 spawn cwd 保证=worktree
# interactive：humanthink 常驻 serve 命令模板（{port} 由编排层替换；缺省 opencode serve --port {port}）
id: opencode
name: OpenCode
protocol: spawn-cli
capabilities: [task, interactive]
command: opencode run --standalone --format json {{prompt}}
timeoutMin: 30
interactive:
  serveCommand: opencode serve --port {port}
